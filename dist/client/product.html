<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOWROOM — TOMODACHI SHOES</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tomodachi: {
              black: '#0A0A0A', surface: '#1A1A1A', chrome: '#2A2A2A',
              silver: '#888888', matte: '#F5F5F5', purple: '#A855F7',
              crimson: '#DC2626', accent: '#FF2D55', muted: '#71717A',
              glass: 'rgba(255,255,255,0.04)',
            }
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
            jp: ['Noto Sans JP', 'sans-serif'],
            en: ['Inter', 'sans-serif'],
          }
        }
      },
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
</head>
<body>

  <div class="grain"></div>
  <div class="scanlines"></div>

  <canvas id="productScene"></canvas>

  <nav class="ts-showroom-nav">
    <a href="catalog.html" class="ts-nav-back">← DOSSIER</a>
    <div class="ts-showroom-nav-title">
      TECH SHOWROOM
      <span class="ts-showroom-nav-sub">技術展示</span>
    </div>
    <div class="ts-showroom-nav-id" id="productIdDisplay">UNIT 0001</div>
  </nav>

  <section class="ts-showroom-ui" id="productUI">
    <div class="ts-showroom-badge">— 最新モデル / LATEST MODEL —</div>
    <h1 class="ts-showroom-name" id="productName">UNIT <span style="color: #A855F7;">0001</span></h1>
    <p class="ts-showroom-tagline">ENGINEERED FOR MOTION — 都市のためのエンジニアリング</p>

    <div class="ts-showroom-stats" id="statsGrid">
      <div class="ts-showroom-stat">
        <span class="ts-showroom-stat-val">180g</span>
        <span class="ts-showroom-stat-lbl">WEIGHT / 重量</span>
      </div>
      <div class="ts-showroom-stat">
        <span class="ts-showroom-stat-val">92%</span>
        <span class="ts-showroom-stat-lbl">ENERGY RETURN / 反発</span>
      </div>
      <div class="ts-showroom-stat">
        <span class="ts-showroom-stat-val">TOKYO</span>
        <span class="ts-showroom-stat-lbl">DIVISION / 事業部</span>
      </div>
      <div class="ts-showroom-stat">
        <span class="ts-showroom-stat-val">¥48,500</span>
        <span class="ts-showroom-stat-lbl">PRICE / 価格</span>
      </div>
    </div>

    <div class="ts-showroom-actions">
      <button class="ts-btn ts-btn-primary" id="buyBtn">
        ACQUIRE UNIT
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <a href="catalog.html" class="ts-btn ts-btn-ghost">
        BACK TO ARCHIVE
      </a>
    </div>
  </section>

  <div class="ts-showroom-jp" id="jpBg">加速</div>

  <script type="module" src="js/product.js"></script>
</body>
</html>
